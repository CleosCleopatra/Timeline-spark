<!DOCTYPE html>
<html>
<head>

<title>Project Timeline</title>

    
<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>


<script src="https://unpkg.com/vis-timeline@latest/standalone/umd/vis-timeline-graph2d.min.js"></script>

<link href="https://unpkg.com/vis-timeline@latest/styles/vis-timeline-graph2d.min.css" rel="stylesheet">

<style>

body {
    font-family: Arial, sans-serif;
    margin:40px;
    background:#f7f7f7;
}

h1 {
    text-align:center;
}

#timeline {
    background:white;
    height:700px;
    border-radius:12px;
}

</style>

</head>

<body>

<h1>Project Timeline</h1>

<div id="timeline"></div>

<p>
    <input
        type = "button"
        id="fullWindow"
        value="Show whole timeperiod"
        /><br />
        <input type = "button" id = "thisMonth" value="Show current month" /><br />

</p>


<script>

const sheetURL =
"https://docs.google.com/spreadsheets/d/e/2PACX-1vTox_xNzPx8-4xMTXq0oV55wZb1bhNKEpHhzlgbyHuwqNjiNvpN90TMONIAqP0q8YxFDWvmvz9iH_Jr/pub?output=csv";

async function loadTimeline(){

    const response = await fetch(sheetURL);

    const data = await response.text();
    console.log(data);


    const parsed = Papa.parse(data, {header:false});
    const rows = parsed.data.slice(1);


    let groups = [];
    let groupIDs={};

    let events=[];


    rows.forEach((row,index)=>{
        console.log("ROW:", row);


    let year=row[1];
    let month = row[2];
    let day = row[3]
    let title=row[0];

    let done = row[7]

    if(!year || !title) return;

    let date = `${year}-${String(month).padStart(2, '0')}-${String(day).padStart(2,'0')}`;
    let color = row[6];
    let category=row[5] || "Other";

    let description=row[4];

    if(!groupIDs[category]){

        groupIDs[category]=groups.length+1;

        groups.push({

            id:groupIDs[category],
            content:category

        });

    }


    let style_type;

    if(done=="TRUE") {
        style_type = `background:${color};color:white;border:5px solid red`
        console.log("style_type:", done, typeof done);
    }
    else{
        style_type = `background:${color};color:white;`
        console.log("not done")
    }

    const current_date = new Date();
    let current_day = current_date.getDate();
    let current_month = current_date.getMonth() + 1;
    let current_year = current_date.getFullYear();

    document.getElementById("fullWindow").onclick = function() {
        timeline.setWindow("2026-06-01", "2027-06-01");
    };
    document.getElementById("thisMonth").onclick = function() {
        timeline.setWindow(`${current_year}-${current_month}-${current_day}`, `${current_year}-${current_month+1}-${current_day}`);
    };



    events.push({

        id:index,

        group:groupIDs[category],

        content:title,

        start:date,

        title:description,

        style:
            style_type
    });
});
console.log("FINAL EVENTS:", events);
console.log("FINAL GROUPS:", groups);

const items = new vis.DataSet(events);
const groupItems = new vis.DataSet(groups);

const timeline = new vis.Timeline(
    document.getElementById("timelins"),
    items,
    groupItems,
    {
        stack: true,
        zoomable: false,
        moveable: true,
        orientation: "top",
        start: "2026-08-01",
        end: "2027-08-01"
    }
);



}

loadTimeline();

</script>


</body>
</html>
